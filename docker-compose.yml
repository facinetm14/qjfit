services:
  db:
    image: postgres:16.3-alpine
    environment:
      POSTGRES_DB: QJFit
      POSTGRES_USER: QJFit
      POSTGRES_PASSWORD: password
    ports:
      - "5432:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data

  redis:
    image: redis:7.2.5-alpine
    ports:
      - "6379:6379"

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    env_file:
      - .env
    depends_on:
      - db
      - redis
    ports:
      - "3000:3000"

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    env_file:
      - .env
    depends_on:
      - api
    ports:
      - "5173:5173"

  caddy:
    image: caddy:2.8.4-alpine
    depends_on:
      - api
      - web
    ports:
      - "80:80"
    volumes:
      - ./ops/Caddyfile:/etc/caddy/Caddyfile:ro

volumes:
  pg_data:
