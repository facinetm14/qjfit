services:
  db:
    image: postgres:16.3-alpine
    environment:
      POSTGRES_DB: QJFit
      POSTGRES_USER: QJFit
      POSTGRES_PASSWORD: password
    ports:
      - "5432:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data

  api:
    build:
      context: .
      dockerfile: apps/back/Dockerfile
      target: dev
    env_file:
      - .env
    depends_on:
      - db
    ports:
      - "3000:3000"
    volumes:
      - ./apps/back:/app/apps/back

  web:
    build:
      context: .
      dockerfile: apps/front/Dockerfile
      target: dev
    env_file:
      - .env
    depends_on:
      - api
    ports:
      - "5173:5173"
    volumes:
      - ./apps/front:/app/apps/front

  caddy:
    image: caddy:2.8.4-alpine
    depends_on:
      - api
      - web
    ports:
      - "8080:80"
      - "8443:443"
    volumes:
      - ./ops/Caddyfile:/etc/caddy/Caddyfile:ro

volumes:
  pg_data:
