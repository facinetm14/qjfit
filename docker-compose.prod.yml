services:
  api:
    image: ghcr.io/facinetm14/QJFit-api:${GITHUB_SHA}
    env_file:
      - .env
    restart: unless-stopped

  web:
    image: ghcr.io/facinetm14/QJFit-web:${GITHUB_SHA}
    env_file:
      - .env
    restart: unless-stopped

  caddy:
    image: caddy:2.8.4-alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./ops/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - api
      - web

volumes:
  caddy_data:
  caddy_config:
