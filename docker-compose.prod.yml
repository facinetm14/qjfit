services:
  db:
    image: postgres:16.3-alpine
    networks:
      - qjfit-network
    env_file:
      - .env
    volumes:
      - pgdata:/var/lib/postgresql/data
    restart: unless-stopped
    ports:
      - "127.0.0.1:5432:5432"

  migrate:
    image: ghcr.io/facinetm14/qjfit-migrate:${GITHUB_SHA}
    env_file:
      - .env
    networks:
      - qjfit-network
    depends_on:
      db:
        condition: service_started
    restart: "no"

  back:
    image: ghcr.io/facinetm14/qjfit-back:${GITHUB_SHA}
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.qjfit-api.rule=Host(`qjfit.facinetkouyate.dev`) && PathPrefix(`/api`)"
      - "traefik.http.routers.qjfit-api.entrypoints=websecure"
      - "traefik.http.routers.qjfit-api.tls.certresolver=letsencrypt"
      - "traefik.http.services.qjfit-api.loadbalancer.server.port=3000"
    depends_on:
      db:
        condition: service_started
      migrate:
        condition: service_completed_successfully
    env_file:
      - .env
    networks:
      - qjfit-network
      - proxy-network
    restart: unless-stopped

  front:
    image: ghcr.io/facinetm14/qjfit-front:${GITHUB_SHA}
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.qjfit.rule=Host(`qjfit.facinetkouyate.dev`)"
      - "traefik.http.routers.qjfit.entrypoints=websecure"
      - "traefik.http.routers.qjfit.tls.certresolver=letsencrypt"
      - "traefik.http.services.qjfit.loadbalancer.server.port=8080"
    env_file:
      - .env
    networks:
      - qjfit-network
      - proxy-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/"]
      interval: 30s
      timeout: 3s
      start_period: 10s
      retries: 3

volumes:
  pgdata:

networks:
  qjfit-network:
    driver: bridge
  proxy-network:
    external: true
