name: Deploy

on:
  workflow_dispatch:

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push API image
        run: |
          docker build -f apps/api/Dockerfile -t ghcr.io/facinetm14/QJFit-api:${GITHUB_SHA} .
          docker push ghcr.io/facinetm14/QJFit-api:${GITHUB_SHA}
      - name: Build and push Web image
        run: |
          docker build -f apps/web/Dockerfile -t ghcr.io/facinetm14/QJFit-web:${GITHUB_SHA} .
          docker push ghcr.io/facinetm14/QJFit-web:${GITHUB_SHA}

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: Placeholder deploy instructions
        run: |
          echo "On target host, pull compose and run:"
          echo "npx prisma migrate deploy"
          echo "docker compose -f docker-compose.prod.yml up -d"
