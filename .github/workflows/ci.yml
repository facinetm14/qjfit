name: CI

on:
  pull_request:
  push:
    branches: ["**"]

jobs:
  quality:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16.3-alpine
        env:
          POSTGRES_USER: QJFit
          POSTGRES_PASSWORD: password
          POSTGRES_DB: QJFit
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U QJFit"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7.2-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: yarn
      - run: corepack enable
      - run: yarn install --frozen-lockfile
      - run: yarn lint
      - run: yarn typecheck
      - run: yarn workspace @qjfit/back prisma:migrate:deploy
        env:
          DATABASE_URL: postgresql://QJFit:password@localhost:5432/QJFit
      - run: yarn test
        env:
          TEST_DATABASE_URL: postgresql://QJFit:password@localhost:5432/QJFit
          TEST_REDIS_URL: redis://localhost:6379
